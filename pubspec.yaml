name: chess_trainer
description: "Advanced chess opening trainer using spaced repetition system"
publish_to: 'none'

version: 1.0.0+1

environment:
  # WasmGC стабильно работает начиная с версий SDK 3.3.0+
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  chessground: ^10.3.0
  dartchess: ^0.14.0
  web: ^0.5.1  # Добавляем для стабильной работы нового поколения Web во Flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
