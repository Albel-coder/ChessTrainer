name: chess_trainer
description: "Advanced chess opening trainer using spaced repetition system"
publish_to: 'none'

version: 1.0.0+1

environment:
  # WasmGC стабильно работает начиная с версий SDK 3.3.0+
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_chess_board: ^1.0.1  # <--- Кроссплатформенная доска с анимациями и Web-поддержкой
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
